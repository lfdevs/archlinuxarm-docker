name: Build Holo core Docker Image

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: lfdevs/holo-core
  ROOTFS_URL: https://holo-packages.steamos.cloud/archlinux-deckard/archlinux/main/system.rootfs.zst

jobs:
  build-base-devel:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: 'holo-core'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Holo core rootfs
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --output /tmp/holo-core.rootfs.zst "$ROOTFS_URL"
          test -s /tmp/holo-core.rootfs.zst

      - name: Import Holo core rootfs
        run: |
          set -euo pipefail
          docker import \
            --platform linux/arm64 \
            --change 'CMD ["/usr/bin/bash"]' \
            --change 'ENV LANG=C.UTF-8' \
            --change 'LABEL org.opencontainers.image.title="Holo core base-devel Image"' \
            --change 'LABEL org.opencontainers.image.description="Holo core, the SteamOS AArch64 core image."' \
            --change 'LABEL org.opencontainers.image.source="https://github.com/lfdevs/archlinuxarm-docker/tree/holo-core"' \
            /tmp/holo-core.rootfs.zst "$IMAGE_NAME:base-devel"

      - name: Test image
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 "$IMAGE_NAME:base-devel" \
            /usr/bin/bash -c 'test "$(uname -m)" = aarch64 && test -f /usr/bin/pacman && test "$(. /etc/os-release && echo "$ID")" = holo-core'

      - name: Push image
        run: docker push "$IMAGE_NAME:base-devel"
