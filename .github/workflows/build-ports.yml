name: Build Arch Linux Ports AArch64 OCI Images

on:
  schedule:
    - cron: '18 10 * * 5'
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: lfdevs/archlinux-ports
  DRZEE_KEY_FINGERPRINT: 9B2C213B21883BB65CE2FB900CF25682E6BA0751
  DRZEE_BOOTSTRAP_URL: https://arch-linux-repo.drzee.net/arch/tarballs/os/aarch64/archlinux-bootstrap-latest-aarch64.tar.zst

jobs:
  build:
    name: Build ${{ matrix.group }}
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        group: [base, base-devel]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: 'ports'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install bootstrap tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg xz-utils zstd

      - name: Set build date
        id: build_date
        run: echo "date=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download and verify drzee bootstrap
        env:
          DRZEE_BOOTSTRAP_SIG_URL: ${{ env.DRZEE_BOOTSTRAP_URL }}.sig
        run: |
          set -euo pipefail
          bootstrap=/tmp/archlinux-bootstrap-aarch64.tar.zst
          signature="${bootstrap}.sig"
          curl --fail --location --retry 3 --output "$bootstrap" "$DRZEE_BOOTSTRAP_URL"
          curl --fail --location --retry 3 --output "$signature" "$DRZEE_BOOTSTRAP_SIG_URL"

          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          gpg --batch --import keys/drzee.gpg
          fingerprint=$(gpg --batch --with-colons --show-keys keys/drzee.gpg |
            awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = "$DRZEE_KEY_FINGERPRINT"
          gpg --batch --verify "$signature" "$bootstrap"

          mkdir /tmp/drzee-rootfs
          sudo tar --zstd --extract --file "$bootstrap" \
            --directory /tmp/drzee-rootfs --strip-components=1
          sudo tar --create --file=- --directory /tmp/drzee-rootfs . | \
            docker import - drzee-builder

      - name: Build rootfs
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            --env GROUP \
            --env DRZEE_KEY_FINGERPRINT \
            drzee-builder \
            /bin/bash -c '
              set -euo pipefail
              pacman-key --init
              pacman-key --populate archlinux
              pacman-key --add /workspace/keys/drzee.gpg
              pacman-key --lsign-key "$DRZEE_KEY_FINGERPRINT"
              pacman -Syyu --noconfirm --disable-sandbox --disable-download-timeout
              pacman -S --noconfirm --disable-sandbox --disable-download-timeout --needed make fakechroot fakeroot zstd
              scripts/make-rootfs.sh "$GROUP" build output
              chown -R "$(stat -c "%u:%g" /workspace)" output
            '

      - name: Generate Dockerfile
        env:
          BUILD_VERSION: ${{ github.run_number }}
          CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          scripts/make-dockerfile.sh \
            "${{ matrix.group }}.tar.zst" \
            "${{ matrix.group }}" output true "${{ matrix.group }}" \
            "$(date -u +%s)"

      - name: Build image
        env:
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          docker build --pull=false \
            --file "output/Dockerfile.${{ matrix.group }}" \
            --tag "$IMAGE_NAME:${{ matrix.group }}-$BUILD_VERSION" \
            --tag "$IMAGE_NAME:${{ matrix.group }}" \
            output

      - name: Test image
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_NAME:${{ matrix.group }}" \
            /bin/bash -c 'test "$(uname -m)" = aarch64 && test "$(pacman-conf Architecture)" = aarch64 && pacman -Qqk'

      - name: Package RootFS
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          archive="archlinux-ports_aarch64_${GROUP}_${{ steps.build_date.outputs.date }}.tar.xz"
          CONTAINER_ID=$(docker create --platform linux/arm64 "$IMAGE_NAME:${GROUP}")
          trap 'docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          docker export "$CONTAINER_ID" | xz -T0 -9 > "$archive"
          sha256sum "$archive" > sha256sums.txt
          cat sha256sums.txt

      - name: Upload RootFS artifact
        uses: actions/upload-artifact@v7
        with:
          name: archlinux-ports_aarch64_${{ matrix.group }}_${{ steps.build_date.outputs.date }}_${{ github.run_id }}
          path: |
            archlinux-ports_aarch64_${{ matrix.group }}_${{ steps.build_date.outputs.date }}.tar.xz
            sha256sums.txt
          retention-days: 90

      - name: Publish image
        env:
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:${{ matrix.group }}-$BUILD_VERSION"
          docker push "$IMAGE_NAME:${{ matrix.group }}"
          if [[ "${{ matrix.group }}" == base ]]; then
            docker tag "$IMAGE_NAME:${{ matrix.group }}" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
          fi

  update-release:
    needs: build
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Download RootFS artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Build release notes with checksums
        shell: bash
        run: |
          set -euo pipefail
          checksums=$(find ./artifacts -type f -name "sha256sums.txt" \
            -exec cat {} \; -exec echo \; |
            awk 'NF >= 2 { print $1 "  " $2 }' | sort -k2,2)
          cat <<'EOF' > release_body.md
          # Arch Linux Ports RootFS Images
          > [!NOTE]
          > * These images have configured the package repository to `drzee.net`. Please try to avoid mixing it with Arch Linux ARM's repo.
          > * Regarding Arch Linux Ports, please refer to the [Arch Linux official documentation](https://ports.archlinux.page/).
          ## Checksums
          ```text
          EOF
          printf '%s\n' "$checksums" >> release_body.md
          printf '%s\n' '```' >> release_body.md

      - name: Delete existing release assets
        uses: actions/github-script@v8
        with:
          script: |
            const tag = 'ports-aarch64';
            const { owner, repo } = context.repo;

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing release found for tag ${tag}, nothing to clean.`);
                return;
              }
              throw error;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.data.id,
              per_page: 100,
            });

            for (const asset of assets) {
              core.info(`Deleting asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
            }

            core.info(`Deleted ${assets.length} asset(s) from release ${release.data.name || tag}.`);

      - name: Upload RootFS archives to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ports-aarch64
          name: ports-aarch64
          draft: false
          make_latest: true
          body_path: release_body.md
          files: |
            ./artifacts/**/archlinux-ports_aarch64_*.tar.xz
